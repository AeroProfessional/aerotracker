name: AeroTracker — Process Registrations

permissions:
  contents: write          # allows the bot to commit state files back

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 * * * *"      # hourly — process new registrations
    - cron: "0 15 * * *"     # 3pm UTC (4pm UK) — spot-check + no-CV report
  workflow_dispatch:          # manual trigger from GitHub Actions tab

jobs:

  # ── Process new registration emails ─────────────────────────────────────────
  process-registrations:
    name: Process new registrations
    runs-on: ubuntu-latest
    timeout-minutes: 55      # hard cap — never runs longer than an hour
    concurrency:
      group: process-registrations   # only one instance at a time
      cancel-in-progress: false      # queue rather than cancel; preserves progress
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Tesseract OCR)
        run: sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run AeroTracker
        env:
          TRACKER_BEARER:      ${{ secrets.TRACKER_BEARER }}
          EMAIL_PASSWORD:      ${{ secrets.EMAIL_PASSWORD }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          GRAPH_TENANT_ID:     ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID:     ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          MAX_PER_RUN: "150"   # process at most 150 candidates per hourly run
          TEST_MODE: "0"
        run: python update_tracker.py

      - name: Commit updated state files
        if: always()           # run even if the Python script crashed — saves partial progress
        run: |
          git config user.name  "AeroTracker Bot"
          git config user.email "support@aeroprofessional.com"
          git add daily_updates.json pending_cv.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update state files [skip ci]"
          if git push --force origin HEAD:main; then
            echo "✓ State files committed and pushed"
          else
            echo "⚠  Push failed"
          fi

  # ── Daily spot-check email at 4pm UK ─────────────────────────────────────────
  spot-check:
    name: Daily spot-check email (4pm UK)
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Send spot-check email
        env:
          EMAIL_PASSWORD:      ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_LOGIN_USER:    "emily.walton@aeroprofessional.com"
          GRAPH_TENANT_ID:     ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID:     ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python spot_check_email.py

  # ── Daily no-CV report at 4pm UK ─────────────────────────────────────────────
  no-cv-report:
    name: Daily no-CV report (4pm UK)
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run no-CV report
        env:
          TRACKER_BEARER:    ${{ secrets.TRACKER_BEARER }}
          EMAIL_PASSWORD:    ${{ secrets.EMAIL_PASSWORD }}
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python no_cv_report.py

      - name: Commit updated watchlist
        if: always()
        run: |
          git config user.name  "AeroTracker Bot"
          git config user.email "support@aeroprofessional.com"
          git add pending_cv.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No watchlist changes to commit"
            exit 0
          fi
          git commit -m "chore: update pending CV watchlist [skip ci]"
          git pull --rebase origin main 2>/dev/null || git pull --rebase origin master 2>/dev/null || true
          if git push; then
            echo "✓ Watchlist committed and pushed"
          else
            echo "⚠  Push failed — will retry next run"
          fi
